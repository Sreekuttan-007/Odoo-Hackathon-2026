# Render Blueprint — deploys Payloom's backend + frontend in one shot.
#
# How to use:
#   1. Push this file (already in the repo).
#   2. Render dashboard → New → Blueprint → connect this GitHub repo.
#   3. Render reads this file and creates both services below.
#   4. Fill the 3 values marked `sync: false` when prompted:
#        - payloom-api  : DATABASE_URL   (your Neon postgresql+psycopg://…?sslmode=require string)
#        - payloom-api  : GEMINI_API_KEY (optional — leave blank to run without the AI brief)
#        - payloom-web  : VITE_API_BASE_URL  ->  https://payloom-api.onrender.com/api
#          (use the real backend URL Render shows you; keep the /api suffix)
#   5. After the first deploy, open payloom-api → Shell:  cd backend && python seed.py
#   6. If CORS blocks login, set payloom-api → CORS_ORIGINS to the exact payloom-web URL.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: payloom-api
    runtime: python
    rootDir: backend
    plan: free
    # Keep the backend in the SAME region as the Neon database
    # (ap-southeast-1 / Singapore) — a cross-region DB round-trip is ~170ms
    # and dominates every request. Same-region is <5ms.
    region: singapore
    buildCommand: pip install -r requirements.txt
    # seed.py is idempotent (look-up-then-create by business key) — safe to
    # run on every boot; it just no-ops once the demo data exists.
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: DATABASE_URL
        sync: false                  # paste your Neon string
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false                  # optional
      - key: CORS_ORIGINS
        value: https://payloom-web.onrender.com   # update if Render assigns a different host

  # --------------------------------------------------------------- frontend
  - type: web
    name: payloom-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                  # https://payloom-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
