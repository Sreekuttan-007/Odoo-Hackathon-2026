services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peoplepay360
      POSTGRES_PASSWORD: peoplepay360
      POSTGRES_DB: peoplepay360
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepay360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
